name: Compilar KAKA Autocomplete

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar EXE
        run: |
          pyinstaller --onefile --windowed --name KAKA_AUTOCOMPLETE autocomplete.py

      - name: Disponibilizar EXE
        uses: actions/upload-artifact@v4
        with:
          name: KAKA_AUTOCOMPLETE
          path: dist/KAKA_AUTOCOMPLETE.exe
